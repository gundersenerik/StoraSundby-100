# Kontrollerna som håller kontrakten bindande.
#
# Kör på varje push och varje pull request. Projektet byggs från flera
# enheter, så kontrollerna måste ligga i CI och inte bara i någons terminal.
#
# swap-list:strict körs INTE här. Den avslutar med exit 1 så länge en enda
# lanseringsblockerare finns kvar, vilket den ska göra i månader till. Den
# ligger i ett eget jobb som bara körs manuellt eller inför produktion.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kontroller:
    name: Typkontroll och kontrakt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      - name: Inget klubbfaktum hårdkodat utanför config/
        run: npm run lint:hardcoded

      - name: SWAP-LIST.md speglar koden
        run: |
          npm run swap-list
          if ! git diff --quiet -- docs/SWAP-LIST.md; then
            echo "::error::docs/SWAP-LIST.md är inte i synk med config/."
            echo "Kör 'npm run swap-list' lokalt och committa resultatet."
            git diff -- docs/SWAP-LIST.md
            exit 1
          fi
          echo "SWAP-LIST.md är aktuell."

      - name: app/tokens.css speglar design.ts
        run: |
          npm run gen:tokens
          if ! git diff --quiet -- app/tokens.css; then
            echo "::error::app/tokens.css är inte i synk med config/design.ts."
            echo "Kör 'npm run gen:tokens' lokalt och committa resultatet."
            git diff -- app/tokens.css
            exit 1
          fi
          echo "tokens.css är aktuell."

      - name: Enhetstester
        run: npm test

      - name: Bygget går igenom
        # URL och publishable key är inte hemligheter. De skickas till varje
        # besökares webbläsare och skyddas av Row Level Security. Därför
        # repo-variabler och inte secrets. Service role-nyckeln finns inte här.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

  e2e:
    name: E2E och tillgänglighet
    runs-on: ubuntu-latest
    needs: kontroller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Playwright och axe-core
        # Service role-nyckeln gar forbi RLS och ar en riktig hemlighet.
        # Den behovs bara for att skapa en inloggningslank utan att ga via
        # en inkorg, sa att E2E kan testa det verkliga flodet.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lanseringskontroll:
    name: Lanseringsblockerare
    runs-on: ubuntu-latest
    # Körs bara manuellt. Blir obligatorisk först när sajten ska till produktion.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Inga påhittade värden kvar
        run: npm run swap-list:strict
